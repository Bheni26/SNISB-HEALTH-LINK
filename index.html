// EXPORT DHIS2
// ═══════════════════════════════════════
function Export({consultations,patients}){
  const[d1,setD1]=useState('');const[d2,setD2]=useState('');const[hist,setHist]=useState([]);
  const fil=()=>{let r=[...consultations];if(d1)r=r.filter(c=>new Date(c.date_consultation)>=new Date(d1));if(d2)r=r.filter(c=>new Date(c.date_consultation)<=new Date(d2+'T23:59:59'));return r;};
  const log=(fmt,nb)=>setHist(h=>[{fmt,nb,date:new Date().toISOString()},...h.slice(0,9)]);
  const expCSV=()=>{const data=fil();const csv=[['ID','Patient_ISUB','Date','Diagnostic','Code_CIM10','Gravite','Notification','Zone','Departement','Score_Qualite','Risque'].join(','),...data.map(c=>[c.id,c.patient_isub,c.date_consultation,c.diagnostic,c.code_cim10,c.gravite,c.notif,c.zone_nom,c.departement,c.quality_score,c.risque].map(v=>'"'+(v===null||v===undefined?'':v)+'"').join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='SNISB_DHIS2_'+new Date().toISOString().slice(0,10)+'.csv';a.click();log('CSV',data.length);};
  const expJSON=()=>{const data=fil();const payload={version:'2.0',source:'SNISB-Health-Link',generatedAt:new Date().toISOString(),country:'BEN',dataValues:data.map(c=>({dataElement:c.code_cim10||'UNKNOWN',period:(c.date_consultation||'').slice(0,10).replace(/-/g,''),orgUnit:c.zone_sanitaire||'BEN-UNKNOWN',value:1,storedBy:'SNISB-v7',comment:'Zone:'+(c.zone_nom||'')+'|Q:'+(c.quality_score||0)+'/100'}))};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='SNISB_DHIS2_'+new Date().toISOString().slice(0,10)+'.json';a.click();log('JSON',data.length);};
  const expPDF=()=>{
    const data=fil();const{jsPDF}=window.jspdf;const doc=new jsPDF();
    doc.setFontSize(14);doc.setFont('helvetica','bold');doc.text('REPUBLIQUE DU BENIN',105,18,{align:'center'});
    doc.setFontSize(11);doc.text('Ministère de la Santé — SNISB Health Link',105,26,{align:'center'});
    doc.setFontSize(9);doc.setFont('helvetica','normal');doc.text('Rapport exporté le '+new Date().toLocaleDateString('fr-FR')+' | '+data.length+' enregistrement(s)',105,33,{align:'center'});
    doc.line(15,37,195,37);doc.setFont('helvetica','bold');doc.text('Patients: '+patients.length,20,44);doc.text('Score qualité moyen: '+(data.length?Math.round(data.reduce((s,c)=>s+(c.quality_score||0),0)/data.length):0)+'/100',110,44);
    doc.line(15,48,195,48);doc.setFontSize(8);doc.text('DATE',20,55);doc.text('DIAGNOSTIC',52,55);doc.text('CIM-10',118,55);doc.text('ZONE',146,55);doc.text('NOTIF.',182,55);
    doc.line(15,57,195,57);doc.setFont('helvetica','normal');let y=63;
    data.slice(0,35).forEach(c=>{if(y>270){doc.addPage();y=20;}doc.text(fmtDate(c.date_consultation),20,y);doc.text((c.diagnostic||'').substring(0,40),52,y);doc.text(c.code_cim10||'',118,y);doc.text((c.zone_nom||'').substring(0,18),146,y);doc.text(c.notif||'',182,y);y+=7;});
    doc.save('SNISB_Rapport_'+new Date().toISOString().slice(0,10)+'.pdf');log('PDF',data.length);
  };
  const data=fil();
  return(<div>
    <p className="page-title">📤 Export & Interopérabilité DHIS2</p>
    <div className="grid-2">
      <div className="card">
        <div className="card-title">⚙️ Paramètres d'export</div>
        <div className="form-row">
          <div className="form-group"><label className="form-label">Date début</label><input className="form-input" type="date" value={d1} onChange={e=>setD1(e.target.value)}/></div>
          <div className="form-group"><label className="form-label">Date fin</label><input className="form-input" type="date" value={d2} onChange={e=>setD2(e.target.value)}/></div>
        </div>
        <div className="alert alert-info"><span className="alert-icon">📊</span><div className="alert-content"><div className="alert-title">{data.length} enregistrement(s) sélectionné(s)</div><div className="alert-text">Score moyen : {data.length?Math.round(data.reduce((s,c)=>s+(c.quality_score||0),0)/data.length):0}/100</div></div></div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button className="btn btn-primary" onClick={expCSV}>📄 CSV</button>
          <button className="btn btn-info" onClick={expJSON}>🔗 JSON DHIS2</button>
          <button className="btn btn-danger" onClick={expPDF}>📕 PDF Officiel</button>
        </div>
      </div>
      <div className="card">
        <div className="card-title">📊 Répartition par notification</div>
        {['immédiate','hebdo','mensuelle'].map(n=>{const cnt=consultations.filter(c=>c.notif===n).length;const pct=consultations.length?Math.round(cnt/consultations.length*100):0;return(
          <div key={n} style={{marginBottom:14}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}><span className={`badge badge-${n==='immédiate'?'immediate':n==='hebdo'?'hebdo':'mensuelle'}`}>{n}</span><strong style={{fontSize:12}}>{cnt} ({pct}%)</strong></div>
            <div className="progress-bar"><div className="progress-fill" style={{width:`${pct}%`,background:n==='immédiate'?'var(--danger)':n==='hebdo'?'var(--warning)':'var(--info)'}}/></div>
          </div>
        );})}
      </div>
    </div>
    {hist.length>0&&<div className="card"><div className="card-title">📜 Historique exports</div><div className="table-wrap"><table>
      <thead><tr><th>Format</th><th>Enregistrements</th><th>Date</th></tr></thead>
      <tbody>{hist.map((e,i)=><tr key={i}><td><span className={`badge ${e.fmt==='PDF'?'badge-immediate':e.fmt==='JSON'?'badge-hebdo':'badge-primary'}`}>{e.fmt}</span></td><td>{e.nb}</td><td>{fmtDT(e.date)}</td></tr>)}</tbody>
    </table></div></div>}
  </div>);
}

// ÉPIDÉMIOLOGIE
// ═══════════════════════════════════════
function Epidemio({user,consultations}){
  const alertes=MALADIES_SIMR.filter(m=>m.notif==='immédiate'&&consultations.some(c=>matchMaladie(c.diagnostic)?.code===m.code));
  const[alertesReelles,setAlertesReelles]=useState([]);
  const[loadingAlertes,setLoadingAlertes]=useState(false);
  const[confirmId,setConfirmId]=useState(null);

  useEffect(()=>{
    if(!supaClient)return;
    setLoadingAlertes(true);
    supaClient.from('alertes_epidemio').select('id,maladie_nom,maladie_code,zone_sanitaire,statut,created_at').eq('statut','ouverte').order('created_at',{ascending:false})
      .then(({data,error})=>{ if(!error&&data)setAlertesReelles(data); setLoadingAlertes(false); });
  },[]);

  const confirmerAlerte=async(id)=>{
    if(!supaClient)return;
    await supaClient.from('alertes_epidemio').update({statut:'notifiee',notifie_dds:true,updated_at:new Date().toISOString()}).eq('id',id);
    setAlertesReelles(prev=>prev.filter(a=>a.id!==id));
    setConfirmId(null);
  };

  return(<div>
    <p className="page-title">🦠 Surveillance Épidémiologique SIMR</p>
    {supaClient&&<div className="card" style={{borderLeft:'4px solid var(--danger)',marginBottom:20}}>
      <div className="card-title" style={{color:'var(--danger)'}}>🚨 Alertes ouvertes nécessitant confirmation</div>
      {loadingAlertes?<div style={{fontSize:13,color:'var(--text-muted)'}}>Chargement...</div>
        :alertesReelles.length===0?<div style={{fontSize:13,color:'var(--text-muted)'}}>Aucune alerte ouverte pour le moment.</div>
        :alertesReelles.map(a=><div key={a.id} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',background:'#FDECEA',borderLeft:'3px solid var(--danger)',borderRadius:'0 10px 10px 0',marginBottom:8}}>
          <span style={{fontSize:20}}>🚨</span>
          <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13}}>{a.maladie_nom} — {a.maladie_code}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>Zone : {a.zone_sanitaire||'—'} · {fmtDT(a.created_at)}</div></div>
          {confirmId===a.id?(
            <div style={{display:'flex',gap:6}}>
              <button className="btn btn-sm btn-danger" onClick={()=>confirmerAlerte(a.id)}>Je confirme, {user.nom}</button>
              <button className="btn btn-sm btn-outline" onClick={()=>setConfirmId(null)}>Annuler</button>
            </div>
          ):(
            <button className="btn btn-sm btn-outline" onClick={()=>setConfirmId(a.id)}>Confirmer le traitement</button>
          )}
        </div>)}
      <div className="form-hint" style={{marginTop:8}}>La confirmation attribue la notification à votre nom et clôt l'alerte — aucune clôture automatique.</div>
    </div>}
    {alertes.length>0&&<div className="card" style={{borderLeft:'4px solid var(--warning)',marginBottom:20}}>
      <div className="card-title" style={{color:'var(--warning)'}}>Maladies détectées dans vos consultations (indicatif)</div>
      {alertes.map(m=><div key={m.code} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',background:'#FFF4E5',borderLeft:'3px solid var(--warning)',borderRadius:'0 10px 10px 0',marginBottom:8}}>
        <span style={{fontSize:20}}>⚠️</span>
        <div><div style={{fontWeight:700,fontSize:13}}>{m.nom} — {m.code}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>Voir « Alertes ouvertes » ci-dessus pour la confirmation officielle</div></div>
      </div>)}
    </div>}
    <div className="grid-3" style={{marginBottom:20}}>
      {['immédiate','hebdo','mensuelle'].map(n=>{const cnt=consultations.filter(c=>c.notif===n).length;return(
        <div key={n} className={`stat-card ${n==='immédiate'?'red':n==='hebdo'?'orange':'blue'}`}>
          <div className="stat-icon">{n==='immédiate'?'🚨':n==='hebdo'?'⚠️':'📋'}</div>
          <div className="stat-number">{cnt}</div>
          <div className="stat-label">Notification {n}</div>
        </div>
      );})}
    </div>
    <div className="grid-2">
      <div className="card">
        <div className="card-title">📊 Causes consultations — Bénin</div>
        {[{l:'Paludisme (1ère cause)',pct:44.7,c:'var(--danger)'},{l:'IRA (2ème cause)',pct:11.9,c:'var(--warning)'},{l:'Diarrhées (3ème cause)',pct:5.4,c:'var(--info)'},{l:'Autres pathologies',pct:38.0,c:'var(--text-muted)'}].map(s=>(
          <div key={s.l} style={{marginBottom:14}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}><span style={{fontSize:12,fontWeight:600}}>{s.l}</span><strong style={{fontSize:13}}>{s.pct}%</strong></div>
            <div className="progress-bar"><div className="progress-fill" style={{width:`${s.pct}%`,background:s.c}}/></div>
          </div>
        ))}
      </div>
      <div className="card">
        <div className="card-title">🦠 29 Maladies sous surveillance SIMR</div>
        <div style={{maxHeight:300,overflowY:'auto'}}>
          {MALADIES_SIMR.map(m=><div key={m.code} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 0',borderBottom:'1px solid var(--border)'}}>
            <div><span style={{fontSize:11,fontWeight:700,color:'var(--primary)'}}>{m.code}</span><span style={{fontSize:11,marginLeft:6}}>{m.nom}</span></div>
            <span className={`badge badge-${m.notif==='immédiate'?'immediate':m.notif==='hebdo'?'hebdo':'mensuelle'}`} style={{flexShrink:0,fontSize:10}}>{m.notif}</span>
          </div>)}
        </div>
      </div>
    </div>
    <div className="card"><div className="card-title">🏥 Indicateurs Politique Nationale de Santé</div>
      <div className="grid-2">
        {[['Mortalité maternelle','397/100 000 naissances vivantes'],['Mortalité infantile','67/1000 naissances vivantes'],['Mortalité infanto-juvénile','125/1000 enfants < 5 ans'],['Prévalence VIH','1,2% (population 15-49 ans)'],['Couverture sanitaire','>80% du territoire national'],['Taux de fréquentation FOSA','45,1% (2008)']].map(([k,v])=>(
          <div key={k} className="kpi-row"><div style={{fontSize:13,color:'var(--text-muted)'}}>{k}</div><div style={{fontWeight:600,fontSize:13,color:'var(--primary)'}}>{v}</div></div>
        ))}
      </div>
    </div>
  </div>);
}

function Carte({consultations}){
  const mapRef=useRef(null);
  const mapInstance=useRef(null);
  const geoLayerRef=useRef(null);
  const[metric,setMetric]=useState('cas');
  const[selectedDept,setSelectedDept]=useState(null);

  const zoneToDept={};
  Object.entries(ZONES_SANITAIRES).forEach(([dept,zones])=>{
    zones.forEach(z=>{ zoneToDept[z.code]=dept; });
  });

  const deptNameNorm=n=>(n||'').toUpperCase()
    .replace('OUÉMÉ','OUEME').replace('KOUFFO','COUFFO').replace('ATACORA','ATACORA');

  const deptData=useMemo(()=>{
    const d={};
    Object.keys(ZONES_SANITAIRES).forEach(dept=>{
      const zones=ZONES_SANITAIRES[dept];
      const zoneCodes=zones.map(z=>z.code);
      const cas=consultations.filter(c=>zoneCodes.includes(c.zone_sanitaire)).length;
      const imm=consultations.filter(c=>zoneCodes.includes(c.zone_sanitaire)&&c.notif==='immédiate').length;
      const pop=zones.reduce((a,z)=>a+(z.pop||0),0);
      const incidence=pop>0?Math.round(cas/pop*100000):0;
      d[dept]={cas,imm,pop,incidence};
    });
    return d;
  },[consultations]);

  const maxVal=Math.max(1,...Object.values(deptData).map(d=>metric==='cas'?d.cas:metric==='imm'?d.imm:d.incidence));

  const getColor=(val)=>{
    const ratio=Math.min(1,val/maxVal);
    if(ratio===0)return'#EEEEEE';
    if(ratio<0.25)return'#4CAF50';
    if(ratio<0.5)return'#FFEB3B';
    if(ratio<0.75)return'#FF9800';
    return'#F44336';
  };

  useEffect(()=>{
    if(!mapRef.current||mapInstance.current)return;
    // Aucun fond de carte externe : les contours des départements sont embarqués dans l'application
    // (fonctionne hors ligne, aucune clé ni service tiers requis).
    mapRef.current.style.background='#E9F0F6';
    const map=L.map(mapRef.current,{zoomControl:true,attributionControl:false,zoomSnap:0.25,minZoom:5.5,maxZoom:10}).setView([9.3077,2.3158],7);
    mapInstance.current=map;
    return()=>{ try{map.stop();}catch(e){} try{map.remove();}catch(e){} mapInstance.current=null; };
  },[]);

  useEffect(()=>{
    const map=mapInstance.current;
    if(!map)return;
    if(geoLayerRef.current){ map.removeLayer(geoLayerRef.current); }

    const findDeptKey=(geoName)=>{
      const norm=(geoName||'').toUpperCase();
      return Object.keys(ZONES_SANITAIRES).find(k=>k===norm||k.includes(norm)||norm.includes(k));
    };

    const layer=L.geoJSON(BENIN_DEPARTMENTS_GEOJSON,{
      style:(feature)=>{
        const key=findDeptKey(feature.properties.name);
        const d=key?deptData[key]:null;
        const val=d?(metric==='cas'?d.cas:metric==='imm'?d.imm:d.incidence):0;
        return{
          fillColor:getColor(val),
          fillOpacity:0.72,
          color:'#ffffff',
          weight:selectedDept===key?2.5:1.2,
          dashArray:feature.properties.precision==='simplifiee'?'4,3':null
        };
      },
      onEachFeature:(feature,lyr)=>{
        const key=findDeptKey(feature.properties.name);
        const d=key?deptData[key]:{cas:0,imm:0,incidence:0,pop:0};
        const precisionNote=feature.properties.precision==='simplifiee'
          ?'<div style="color:#B26A00;font-size:11px;margin-top:6px;">Contour simplifié (données précises à venir)</div>':'';
        lyr.bindPopup(
          '<div style="font-weight:600;font-size:13px;margin-bottom:6px;">'+feature.properties.name+'</div>'+
          '<div style="font-size:12px;line-height:1.7;">'+
          'Consultations : <strong>'+d.cas+'</strong><br/>'+
          'Alertes immédiates : <strong style="color:#D32F2F;">'+d.imm+'</strong><br/>'+
          'Incidence : <strong>'+d.incidence+'</strong> / 100 000 hab.'+
          '</div>'+precisionNote
        );
        lyr.on('mouseover',function(){ this.setStyle({fillOpacity:0.88,weight:2}); });
        lyr.on('mouseout',function(){ layer.resetStyle(this); });
        lyr.on('click',function(){ setSelectedDept(key===selectedDept?null:key); });
      }
    }).addTo(map);
    geoLayerRef.current=layer;
    if(!map.__cadre){map.__cadre=true;try{if(mapInstance.current===map&&map._loaded)map.fitBounds(layer.getBounds(),{padding:[12,12],animate:false});}catch(e){}}
  },[deptData,metric,selectedDept]);

  const selDept=selectedDept?(ZONES_SANITAIRES[selectedDept]||[]):[];

  return(<div>
    <p className="page-title">Carte Épidémique du Bénin</p>
    <p className="page-sub">12 départements, 34 zones sanitaires — Limites administratives réelles (source : données SIG publiques, licence CC-BY 4.0)</p>
    <div className="grid-2">
      <div>
        <div className="map-shell">
          <div className="map-toolbar">
            {[['cas','Consultations'],['imm','Alertes immédiates'],['incidence','Incidence /100k']].map(([v,l])=>(
              <button key={v} className={`inner-tab ${metric===v?'active':''}`} style={{marginBottom:0}} onClick={()=>setMetric(v)}>{l}</button>
            ))}
          </div>
          <div style={{position:'relative'}}>
            <div id="leaflet-map" ref={mapRef}></div>
            <div className="map-legend">
              <div style={{fontWeight:600,marginBottom:6,fontSize:11}}>Légende</div>
              {[['Aucun cas','#EEEEEE'],['Faible','#4CAF50'],['Modéré','#FFEB3B'],['Élevé','#FF9800'],['Alerte','#F44336']].map(([l,c])=>(
                <div key={l} className="map-legend-row"><div className="map-legend-swatch" style={{background:c}}></div><span>{l}</span></div>
              ))}
            </div>
          </div>
        </div>
      </div>
      <div>
        <div className="card">
          <div className="card-title">Classement des départements</div>
          <div style={{maxHeight:220,overflowY:'auto'}}>
            {Object.entries(deptData).sort((a,b)=>b[1].cas-a[1].cas).map(([dept,d],i)=>(
              <div key={dept} onClick={()=>setSelectedDept(dept===selectedDept?null:dept)} style={{display:'flex',alignItems:'center',gap:10,padding:'8px',cursor:'pointer',borderRadius:6,background:selectedDept===dept?'var(--primary-light)':'transparent',marginBottom:2}}>
                <span style={{fontSize:11,fontWeight:600,color:'var(--text-muted)',minWidth:16}}>{i+1}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:500}}>{dept.charAt(0)+dept.slice(1).toLowerCase()}</div>
                  <div className="progress-bar" style={{height:4,marginTop:4}}><div className="progress-fill" style={{width:`${Math.round(d.cas/Math.max(1,maxVal)*100)}%`,background:getColor(d.cas)}}/></div>
                </div>
                <span style={{fontSize:13,fontWeight:600}}>{d.cas}</span>
                {d.imm>0&&<span className="badge badge-immediate">{d.imm}</span>}
              </div>
            ))}
          </div>
        </div>
        {selectedDept&&<div className="card">
          <div className="card-title">{selectedDept.charAt(0)+selectedDept.slice(1).toLowerCase()} — Zones sanitaires</div>
          {selDept.map(z=>{
            const cnt=consultations.filter(c=>c.zone_sanitaire===z.code).length;
            return(<div key={z.code} style={{padding:'9px 0',borderBottom:'1px solid var(--gray-100)'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div><div style={{fontSize:13,fontWeight:500}}>{z.nom}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{z.code} · {z.pop?.toLocaleString('fr-FR')} hab.</div></div>
                <span style={{fontWeight:600,fontSize:13,color:cnt>0?'var(--primary)':'var(--text-muted)'}}>{cnt}</span>
              </div>
            </div>);
          })}
        </div>}
        <div className="alert alert-info">
          <span className="alert-icon material-symbols-rounded">info</span>
          <div className="alert-content"><div className="alert-text">8 départements affichent des frontières précises (source SIG officielle). Les 4 départements côtiers restants (Couffo, Littoral, Mono, Atlantique) sont en contour simplifié — bordure en pointillés sur la carte.</div></div>
        </div>
      </div>
    </div>
  </div>);
}

function IAClinique({user,patients,consultations}){
  const estPatient=user.role==='patient';
  const welcomeMsg=estPatient?('Bonjour '+user.nom+' ! Je suis l\u2019assistant sant\u00e9 SNISB.\n\nJe donne des informations g\u00e9n\u00e9rales de pr\u00e9vention (hygi\u00e8ne, vaccination, paludisme, nutrition, grossesse) et je vous dis quand consulter.\n\nJe ne pose pas de diagnostic, je ne prescris rien et je ne remplace pas une consultation. Pour un probl\u00e8me de sant\u00e9, utilisez l\u2019onglet T\u00e9l\u00e9consultation. En urgence : SAMU 161.'):('Bonjour Dr. '+user.nom+' ! Je suis votre assistant IA clinique SNISB.\n\nJe peux vous aider avec :\n\u{1F50D} Analyse diagnostique — Diagnostics différentiels\n\u{1F9A0} Épidémiologie — Tendances dans votre zone\n\u{1F48A} Protocoles — Guides thérapeutiques béninois\n\u{1F4CA} Données SNISB — Vos statistiques locales\n\nComment puis-je vous aider ?');
  const[messages,setMessages]=useState([{role:'ai',content:welcomeMsg}]);
  const[input,setInput]=useState('');
  const[loading,setLoading]=useState(false);
  const endRef=useRef(null);
  const QUICK_PROMPTS=estPatient?['Comment prévenir le paludisme ?','Calendrier des vaccins de l\u2019enfant','Bonnes pratiques d\u2019hygiène des mains','Quand dois-je consulter pendant la grossesse ?','Alimentation saine du nourrisson']:['Protocole traitement paludisme simple Bénin','Critères de gravité méningite','Seuil alerte épidémique choléra','Analyse épidémio de ma zone','Définition de cas rougeole SIMR'];

  useEffect(()=>{ if(endRef.current)endRef.current.scrollIntoView({behavior:'smooth'}); },[messages]);

  const buildContext=()=>{
    if(estPatient)return 'Patient du Bénin. Information de santé publique uniquement.';
    const totalP=patients.length;
    const totalC=consultations.length;
    const alertes=consultations.filter(c=>c.notif==='immédiate').length;
    const zoneUser=user.zone?TOUTES_ZONES.find(z=>z.code===user.zone)?.nom||user.zone:'nationale';
    return 'Contexte SNISB Health Link — Bénin:\n'
      +'- Agent: '+user.nom+' ('+( ROLES[user.role]?.label||user.role)+')\n'
      +'- Zone: '+zoneUser+' | Département: '+(user.dept||'non défini')+'\n'
      +'- Données locales: '+totalP+' patients, '+totalC+' consultations, '+alertes+' alertes\n'
      +'- Statistiques nationales: paludisme 44.7%, IRA 11.9%, diarrhées 5.4%\n'
      +'- Système: SIMR avec 29 maladies dont 13 à notification immédiate\n'
      +'- Contexte: Bénin, Ministère de la Santé, guides OMS adaptés';
  };

  const send=async(txt)=>{
    const q=txt||input.trim();
    if(!q||loading)return;
    setInput('');
    const userMsg={role:'user',content:q};
    setMessages(m=>[...m,userMsg]);
    setLoading(true);
    try{
      let token='';
      if(supaClient){
        const{data:sessionData}=await supaClient.auth.getSession();
        token=sessionData?.session?.access_token||'';
      }
      if(!token)throw new Error('Session Supabase absente — reconnectez-vous avec votre vrai mot de passe Supabase (pas le mot de passe démo).');
      const resp=await fetch(EDGE_FUNCTIONS_URL+'/claude-proxy',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify({
          messages:[...messages.filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role==='ai'?'assistant':m.role,content:m.content})),{role:'user',content:q}],
          context:buildContext()
        })
      });
      if(!resp.ok){const err=await resp.json();throw new Error(err.error||'Erreur serveur');}
      const data=await resp.json();
      const aiText=data.content?.find(b=>b.type==='text')?.text||'Désolé, je n\'ai pas pu traiter votre demande.';
      setMessages(m=>[...m,{role:'ai',content:aiText}]);
    }catch(e){
      setMessages(m=>[...m,{role:'ai',content:'⚠️ Connexion temporairement indisponible.\n\nConsultez le guide SIMR ou contactez le niveau central SNISB.\n\nErreur: '+e.message}]);
    }
    setLoading(false);
  };

  const formatMsg=txt=>{
    return txt.split('\n').map((line,i)=>{
      if(line.startsWith('**')&&line.endsWith('**'))return<div key={i} style={{fontWeight:700,marginTop:4}}>{line.slice(2,-2)}</div>;
      if(line.startsWith('- '))return<div key={i} style={{paddingLeft:12,marginTop:2}}>• {line.slice(2)}</div>;
      if(line.startsWith('#'))return<div key={i} style={{fontWeight:700,fontSize:14,marginTop:6}}>{line.replace(/^#+\s/,'')}</div>;
      return<div key={i} style={{marginTop:line?2:4}}>{line||' '}</div>;
    });
  };

  return(<div>
    <p className="page-title">{estPatient?'🤖 Assistant santé SNISB':'🤖 IA Clinique — Assistant SNISB'}</p>
    <div className="grid-2">
      <div className="ai-panel" style={{marginBottom:16}}>
        <div className="ai-panel-title">{estPatient?'🤖 Assistant santé (information générale)':'🤖 Assistant IA Clinique'}</div>
        <div className="ai-panel-sub">Propulsé par Claude • Contexte SNISB intégré</div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:11,opacity:0.6,marginBottom:8,textTransform:'uppercase',letterSpacing:'0.5px'}}>Questions rapides :</div>
          {QUICK_PROMPTS.map((p,i)=><button key={i} className="ai-chip" onClick={()=>send(p)}>{p}</button>)}
        </div>
        <div style={{padding:12,background:'rgba(255,255,255,0.06)',borderRadius:10,fontSize:12,opacity:0.7}}>
          <div style={{fontWeight:600,marginBottom:4}}>⚠️ Avertissement</div>
          {estPatient?'Cet assistant ne fait ni diagnostic, ni prescription, ni consultation. Pour un souci de santé : onglet Téléconsultation. Urgence : SAMU 161.':'L\'IA complète sans remplacer le jugement clinique. Toujours valider avec un médecin. En urgence, appeler le SAMU (161).'}
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,display:estPatient?'none':'grid'}}>
        {[{i:'👤',l:'Patients',v:patients.length,c:'var(--success)'},{i:'🩺',l:'Consultations',v:consultations.length,c:'var(--info)'},{i:'🚨',l:'Alertes',v:consultations.filter(c=>c.notif==='immédiate').length,c:'var(--danger)'},{i:'🦠',l:'Maladies SIMR',v:29,c:'var(--warning)'}].map((s,i)=>(
          <div key={i} style={{background:'white',borderRadius:12,padding:16,boxShadow:'var(--shadow)'}}>
            <div style={{fontSize:24}}>{s.i}</div>
            <div style={{fontSize:22,fontWeight:700,color:s.c}}>{s.v}</div>
            <div style={{fontSize:11,color:'var(--text-muted)'}}>{s.l}</div>
          </div>
        ))}
      </div>
    </div>
    <div className="card" style={{padding:0,overflow:'hidden'}}>
      <div style={{padding:'14px 20px',background:'linear-gradient(135deg,#0D1B2A,#1B2838)',color:'white',display:'flex',alignItems:'center',gap:10}}>
        <span style={{fontSize:20}}>🤖</span>
        <div><div style={{fontWeight:700,fontSize:14}}>{estPatient?'Assistant santé SNISB':'Assistant IA Clinique SNISB'}</div><div style={{fontSize:11,opacity:0.6}}>{estPatient?'Information générale de prévention':'Claude • Contexte Bénin intégré'}</div></div>
        <div style={{marginLeft:'auto',display:'flex',gap:6}}>
          <span style={{fontSize:10,padding:'3px 8px',background:'rgba(0,133,62,0.3)',borderRadius:10,color:'#2ECC71'}}>● En ligne</span>
        </div>
      </div>
      <div className="ai-messages">
        {messages.map((m,i)=>(
          <div key={i} className={`ai-msg ${m.role}`}>
            {m.role==='ai'&&<div style={{fontSize:10,color:'var(--text-muted)',marginBottom:4}}>🤖 Assistant SNISB</div>}
            <div style={{fontSize:13,lineHeight:1.6}}>{formatMsg(m.content)}</div>
          </div>
        ))}
        {loading&&<div className="ai-msg ai typing"><div style={{fontSize:10,color:'var(--text-muted)',marginBottom:4}}>🤖 Assistant SNISB</div><div>⏳ Analyse en cours...</div></div>}
        <div ref={endRef}/>
      </div>
      <div className="ai-input-row">
        <input className="ai-input" placeholder={estPatient?'Posez une question de prévention...':'Posez votre question clinique ou épidémiologique...'} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&send()} disabled={loading}/>
        <button className="btn btn-primary btn-sm" onClick={()=>send()} disabled={!input.trim()||loading}>{loading?'⏳':'📤'}</button>
      </div>
    </div>
  </div>);
}

// FORMATION
// ═══════════════════════════════════════
function Formation({user}){
  const[progress,setProgress]=useState({});const[active,setActive]=useState(null);
  const[chap,setChap]=useState(0);const[quiz,setQuiz]=useState(false);const[ans,setAns]=useState({});const[done,setDone]=useState(false);
  const start=m=>{setActive(m);setChap(0);setQuiz(false);setAns({});setDone(false);};
  const next=()=>{if(chap<active.chapitres.length-1)setChap(chap+1);else setQuiz(true);};
  const submit=()=>{const ok=active.quiz.filter((q,i)=>ans[i]===q.ok).length;const sc=Math.round(ok/active.quiz.length*100);setProgress(p=>({...p,[active.id]:{sc,ok:sc>=70,date:new Date().toISOString()}}));setDone(true);};
  const total=Object.values(progress).filter(p=>p.ok).length;
  if(active){const pr=progress[active.id];return(<div>
    <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
      <button className="btn btn-outline btn-sm" onClick={()=>setActive(null)}>← Retour</button>
      <p className="page-title" style={{marginBottom:0}}>{active.icon} {active.titre}</p>
    </div>
    {!quiz?(<div className="card" style={{maxWidth:680}}>
      <div style={{marginBottom:14}}><div className="progress-bar"><div className="progress-fill" style={{width:`${(chap/active.chapitres.length)*100}%`}}/></div><div style={{fontSize:11,color:'var(--text-muted)',marginTop:4}}>Chapitre {chap+1} / {active.chapitres.length}</div></div>
      <div className="card-title">📖 {active.chapitres[chap]}</div>
      <div style={{padding:20,background:'var(--light)',borderRadius:10,marginBottom:16}}>
        <p style={{fontSize:14,lineHeight:1.8}}>Ce chapitre traite de <strong>{active.chapitres[chap]}</strong> dans le contexte du système de santé béninois. La maîtrise de ce sujet est essentielle pour améliorer la qualité des données sanitaires et renforcer la surveillance épidémiologique des 12 millions d'habitants du Bénin.</p>
        <div style={{marginTop:12,padding:12,background:'var(--primary-light)',borderRadius:8,borderLeft:'3px solid var(--primary)'}}>
          <strong style={{fontSize:12,color:'var(--primary)'}}>💡 Point clé :</strong>
          <p style={{fontSize:13,marginTop:4}}>Une collecte de données de qualité permet d'anticiper les épidémies, optimiser les ressources et améliorer les indicateurs sanitaires nationaux.</p>
        </div>
      </div>
      <button className="btn btn-primary" onClick={next}>{chap<active.chapitres.length-1?'→ Chapitre suivant':'📝 Passer au quiz'}</button>
    </div>):!done?(<div className="card" style={{maxWidth:600}}>
      <div className="card-title">📝 Quiz — {active.titre}</div>
      {active.quiz.map((q,qi)=><div key={qi} style={{marginBottom:20}}>
        <div style={{fontWeight:600,marginBottom:10}}>{qi+1}. {q.q}</div>
        {q.opts.map((o,oi)=><div key={oi} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',border:`2px solid ${ans[qi]===oi?'var(--primary)':'var(--border)'}`,borderRadius:10,marginBottom:6,cursor:'pointer',background:ans[qi]===oi?'var(--primary-light)':'white',transition:'all 0.15s'}} onClick={()=>setAns(a=>({...a,[qi]:oi}))}>
          <div style={{width:18,height:18,border:`2px solid ${ans[qi]===oi?'var(--primary)':'var(--border)'}`,borderRadius:'50%',background:ans[qi]===oi?'var(--primary)':'white',flexShrink:0}}/>
          <span style={{fontSize:13}}>{o}</span>
        </div>)}
      </div>)}
      <button className="btn btn-primary" onClick={submit} disabled={Object.keys(ans).length<active.quiz.length}>✅ Valider le quiz</button>
    </div>):(<div className="card" style={{maxWidth:480,textAlign:'center'}}>
      <div style={{fontSize:64,marginBottom:12}}>{pr?.ok?'🏆':'📝'}</div>
      <h3 style={{fontSize:20,fontWeight:700,marginBottom:8}}>{pr?.ok?'Félicitations !':'À revoir...'}</h3>
      <div style={{fontSize:36,fontWeight:700,color:pr?.ok?'var(--success)':'var(--warning)',marginBottom:12}}>{pr?.sc}%</div>
      <p style={{fontSize:14,color:'var(--text-muted)',marginBottom:20}}>{pr?.ok?'Module validé avec succès !':'Score insuffisant — minimum 70% requis'}</p>
      {pr?.ok&&<div className="alert alert-success" style={{textAlign:'left',marginBottom:16}}><span className="alert-icon">🏅</span><div className="alert-content"><div className="alert-title">Certificat obtenu !</div><div className="alert-text">{user.nom} — {active.titre} — {new Date().toLocaleDateString('fr-FR')}</div></div></div>}
      <div style={{display:'flex',gap:8,justifyContent:'center'}}><button className="btn btn-outline" onClick={()=>start(active)}>🔄 Recommencer</button><button className="btn btn-primary" onClick={()=>setActive(null)}>← Modules</button></div>
    </div>)}
  </div>);}
  return(<div>
    <p className="page-title">📚 Formation Intégrée</p>
    <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:20}}>
      <span style={{color:'var(--text-muted)',fontSize:13}}>{total}/{MODULES_FORMATION.length} modules validés</span>
      <div className="progress-bar" style={{flex:1}}><div className="progress-fill" style={{width:`${total/MODULES_FORMATION.length*100}%`}}/></div>
      <strong style={{color:'var(--primary)'}}>{Math.round(total/MODULES_FORMATION.length*100)}%</strong>
    </div>
    <div className="grid-2">
      {MODULES_FORMATION.map(m=>{const pr=progress[m.id];return(
        <div key={m.id} className={`module-card ${pr?.ok?'completed':''}`} onClick={()=>start(m)}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div style={{fontSize:32,marginBottom:8}}>{m.icon}</div>
            {pr?.ok&&<span className="badge badge-success">✅ Validé</span>}
            {pr&&!pr.ok&&<span className="badge badge-hebdo">⚠️ {pr.sc}%</span>}
          </div>
          <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>{m.titre}</div>
          <div style={{fontSize:11,color:'var(--text-muted)'}}>{m.duree} • {m.niveau} • {m.chapitres.length} chapitres • {m.quiz.length} questions</div>
          {pr&&<div style={{marginTop:10}}><div className="progress-bar" style={{height:6}}><div className="progress-fill" style={{width:`${pr.sc}%`,background:pr.ok?'var(--success)':'var(--warning)'}}/></div></div>}
        </div>
      );})}
    </div>
  </div>);
}

// ADMIN
// ═══════════════════════════════════════
function Admin({user,patients,consultations}){
  const[tab,setTab]=useState('users');
  const[realUsers,setRealUsers]=useState([]);
  const[realLogs,setRealLogs]=useState([]);
  const[loadingUsers,setLoadingUsers]=useState(false);
  const[loadingLogs,setLoadingLogs]=useState(false);
  const[nc,setNc]=useState({nom:'',username:'',role:'medecin',zone:'',departement:'',email:'',commune:'',arrondissement:'',village:'',structure_type:'',structure_nom:''});
  const[ncAcces,setNcAcces]=useState(null);const[ncErr,setNcErr]=useState('');const[ncBusy,setNcBusy]=useState(false);
  const creerCompte=async()=>{
    setNcBusy(true);setNcErr('');
    const r=await callCreateAccount(Object.assign({action:'staff'},nc,{email:nc.email||null}));
    setNcBusy(false);
    if(r.data){setNcAcces(Object.assign({nom:nc.nom},r.data));setNc({nom:'',username:'',role:'medecin',zone:'',departement:'',email:'',commune:'',arrondissement:'',village:'',structure_type:'',structure_nom:''});setRealUsers([]);}else setNcErr(r.error);
  };

  useEffect(()=>{
    if(tab==='users'&&supaClient&&realUsers.length===0){
      setLoadingUsers(true);
      supaClient.from('profiles').select('username,nom,role,zone,departement,actif,niveau,structure_nom,village').order('nom')
        .then(({data,error})=>{ if(!error&&data)setRealUsers(data); setLoadingUsers(false); });
    }
    if(tab==='logs'&&supaClient&&realLogs.length===0){
      setLoadingLogs(true);
      supaClient.from('audit_logs').select('action,user_nom,details,created_at').order('created_at',{ascending:false}).limit(50)
        .then(({data,error})=>{ if(!error&&data)setRealLogs(data); setLoadingLogs(false); });
    }
  },[tab]);

  return(<div>
    <p className="page-title">⚙️ Administration</p>
    <div className="inner-tabs">
      {[['users','👥 Utilisateurs'],['comptes','➕ Créer un compte'],['zones','🗺️ Zones sanitaires'],['kpi','📊 KPIs'],['logs','📝 Audit'],['pwa','📱 PWA & Sync']].map(([t,l])=><button key={t} className={`inner-tab ${tab===t?'active':''}`} onClick={()=>setTab(t)}>{l}</button>)}
    </div>
    {tab==='comptes'&&<div>
      {ncAcces&&<CredentialsCard acces={ncAcces} onClose={()=>setNcAcces(null)}/>}
      <div className="card"><div className="card-title">➕ Créer un compte du personnel</div>
        {ncErr&&<div className="alert alert-danger"><div className="alert-content"><div className="alert-text">{ncErr}</div></div></div>}
        <div className="form-row">
          <div className="form-group"><label className="form-label">Nom complet *</label><input className="form-input" value={nc.nom} onChange={e=>setNc(Object.assign({},nc,{nom:e.target.value}))}/></div>
          <div className="form-group"><label className="form-label">Identifiant * (lettres/chiffres)</label><input className="form-input" value={nc.username} onChange={e=>setNc(Object.assign({},nc,{username:e.target.value}))}/></div>
        </div>
        <div className="form-row">
          <div className="form-group"><label className="form-label">Rôle *</label><select className="form-select" value={nc.role} onChange={e=>setNc(Object.assign({},nc,{role:e.target.value}))}>{['medecin','infirmier','statisticien','superviseur','admin','asc','relais'].map(r=><option key={r} value={r}>{ROLES[r]?ROLES[r].label:r}</option>)}</select></div>
          <div className="form-group"><label className="form-label">E-mail (facultatif)</label><input className="form-input" type="email" value={nc.email} onChange={e=>setNc(Object.assign({},nc,{email:e.target.value}))}/></div>
        </div>
        <div className="form-row">
          <div className="form-group"><label className="form-label">Département</label>
            <select className="form-select" value={nc.departement} onChange={e=>setNc(Object.assign({},nc,{departement:e.target.value,zone:''}))}><option value="">— Choisir —</option>{Object.keys(ZONES_SANITAIRES).map(d=><option key={d} value={d}>{d}</option>)}</select></div>
          <div className="form-group"><label className="form-label">Zone sanitaire{(nc.role==='relais'||nc.role==='asc'||nc.role==='medecin'||nc.role==='infirmier')?' *':''}</label>
            <select className="form-select" value={nc.zone} disabled={!nc.departement} onChange={e=>setNc(Object.assign({},nc,{zone:e.target.value}))}><option value="">— Choisir —</option>{(ZONES_SANITAIRES[nc.departement]||[]).map(z=><option key={z.code} value={z.code}>{z.nom}</option>)}</select></div>
        </div>
        {(nc.role==='relais'||nc.role==='asc')&&<div className="form-row">
          <div className="form-group"><label className="form-label">Commune</label><input className="form-input" value={nc.commune} onChange={e=>setNc(Object.assign({},nc,{commune:e.target.value}))}/></div>
          <div className="form-group"><label className="form-label">Arrondissement *</label><input className="form-input" value={nc.arrondissement} onChange={e=>setNc(Object.assign({},nc,{arrondissement:e.target.value}))}/></div>
          <div className="form-group"><label className="form-label">Village / quartier{nc.role==='relais'?' *':''}</label><input className="form-input" value={nc.village} onChange={e=>setNc(Object.assign({},nc,{village:e.target.value}))}/></div>
        </div>}
        <div className="form-row">
          <div className="form-group"><label className="form-label">Type de structure (facultatif)</label><select className="form-select" value={nc.structure_type} onChange={e=>setNc(Object.assign({},nc,{structure_type:e.target.value}))}><option value="">—</option>{STRUCTURES_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select></div>
          <div className="form-group"><label className="form-label">Nom de la structure (centre de santé de rattachement)</label><input className="form-input" value={nc.structure_nom} onChange={e=>setNc(Object.assign({},nc,{structure_nom:e.target.value}))}/></div>
        </div>
        <button className="btn btn-primary" onClick={creerCompte} disabled={ncBusy||nc.nom.trim().length<3||nc.username.trim().length<3||((nc.role==='relais'||nc.role==='asc')&&(!nc.zone||!nc.arrondissement.trim()||(nc.role==='relais'&&!nc.village.trim())))}>{ncBusy?'Création...':'Créer le compte'}</button>
        <div className="form-hint">Un mot de passe temporaire est généré ; la personne devra le changer à sa première connexion. Médecin et infirmier d’une même zone voient les mêmes patients. Relais et ASCQ : zone, arrondissement et village obligatoires ; ils ne voient aucun dossier médical.</div>
      </div>
    </div>}
    {tab==='users'&&<div className="card"><div className="card-title">👥 Utilisateurs du système</div>
      {!supaClient?<div className="empty-state"><div className="empty-text">Connexion serveur requise pour afficher les utilisateurs réels.</div></div>
      :loadingUsers?<div className="empty-state"><div className="empty-text">Chargement...</div></div>
      :realUsers.length===0?<div className="empty-state"><div className="empty-text">Aucun utilisateur trouvé dans la base.</div></div>
      :<div className="table-wrap"><table>
      <thead><tr><th>Nom</th><th>Username</th><th>Rôle</th><th>Zone</th><th>Département</th><th>Structure / village</th><th>Statut</th></tr></thead>

// Outbox hors ligne (localStorage) — jamais bloquant si le stockage est indisponible
const lsGet=(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const OUTBOX_KEY='snisb_carnet_outbox';

async function carnetFlushOutbox(){
  if(!supaClient)return{sent:0,left:lsGet(OUTBOX_KEY,[]).length,tableMissing:false};
  const box=lsGet(OUTBOX_KEY,[]);const left=[];let sent=0,tableMissing=false;
  for(const row of box){
    try{
      const{error}=await supaClient.from('carnet_entries').insert(row);
      if(!error||error.code==='23505'){sent++;}
      else{ if(error.code==='42P01'||(error.message||'').includes('carnet_entries'))tableMissing=true; left.push(row);}
    }catch(e){left.push(row);}
  }
  lsSet(OUTBOX_KEY,left);
  return{sent:sent,left:left.length,tableMissing:tableMissing};
}

        {f.t==='check'
          ?<label style={{display:'flex',alignItems:'center',gap:8,fontSize:14}}><input type="checkbox" checked={!!vals[f.k]} onChange={e=>set(f.k,e.target.checked)}/>{f.l}</label>
          :<>
            <label className="form-label" htmlFor={id}>{f.l}{def.required.indexOf(f.k)>=0?' *':''}</label>
            {f.t==='select'?<select id={id} className="form-select" value={v} onChange={e=>set(f.k,e.target.value)}><option value="">—</option>{f.opts.map(o=><option key={o} value={o}>{o}</option>)}</select>
            :f.t==='area'?<textarea id={id} className="form-input" rows={3} value={v} onChange={e=>set(f.k,e.target.value)}/>
            :<input id={id} className="form-input" type={f.t==='number'?'number':f.t==='date'?'date':f.t==='time'?'time':'text'} step={f.step} min={f.min} max={f.max} placeholder={f.ph||''} value={v} onChange={e=>set(f.k,e.target.value)}/>}
          </>}
      </div>);
    })}
  </div>);
}

function validerSaisie(sec,vals,dateActe,patient){
  const def=CARNET_SECTIONS[sec];const errs=[];
  if(!dateActe)errs.push('La date est obligatoire.');
  else{
    if(dateActe>todayISO())errs.push('La date ne peut pas être dans le futur.');
    if(patient&&patient.date_naissance&&sec!=='famille'&&sec!=='antecedents'&&dateActe<String(patient.date_naissance).slice(0,10)&&sec!=='gyneco')errs.push('La date ne peut pas précéder la naissance du patient.');
  }
  def.required.forEach(k=>{const f=def.fields.find(x=>x.k===k);if(vals[k]===undefined||vals[k]===''||vals[k]===null)errs.push('Champ obligatoire : '+(f?f.l:k));});
  def.fields.forEach(f=>{
    const v=vals[f.k];if(v===undefined||v===''||v===null||f.t==='h')return;
    if(f.t==='number'){const n=Number(v);if(isNaN(n))errs.push(f.l+' : nombre attendu.');else if(f.min!==undefined&&n<f.min||f.max!==undefined&&n>f.max)errs.push(f.l+' : valeur hors limites ('+f.min+' à '+f.max+').');}
    if(f.pattern&&!(new RegExp(f.pattern)).test(String(v)))errs.push(f.err||(f.l+' : format invalide.'));
  });
  if(sec==='vaccination'&&vals.vaccin==='Autre (préciser)'&&!(vals.autre||'').trim())errs.push('Précisez le nom du vaccin.');
  return errs;
}

function CarnetCroissance({patient,entries}){
  const sex=patient.sexe==='F'?'F':'M';
  const W=640,H=360,PL=44,PR=14,PT=14,PB=36;
  const x=m=>PL+(m/60)*(W-PL-PR);
  const y=w=>PT+(1-(w/30))*(H-PT-PB);
  const zs=[[-3,'#212121'],[-2,'#C62828'],[0,'#2E7D32'],[2,'#C62828'],[3,'#212121']];
  const curve=z=>{let d='';for(let m=0;m<=60;m++){const w=whoWeight(sex,m,z);d+=(m===0?'M':'L')+x(m).toFixed(1)+' '+y(Math.min(w,30)).toFixed(1)+' ';}return d;};
  const pts=entries.map(e=>{const mo=ageMonths(patient.date_naissance,e.date_acte);const w=Number(e.data&&e.data.poids_kg);if(mo===null||isNaN(w)||mo<0||mo>60)return null;const mi=Math.round(mo);return{m:mo,w:w,z:whoZ(sex,mi,w),date:e.date_acte};}).filter(Boolean).sort((a,b)=>a.m-b.m);
  const last=pts.length?pts[pts.length-1]:null;
  const etat=z=>z===null?'—':z<-3?'Insuffisance pondérale sévère':z<-2?'Insuffisance pondérale modérée':z>2?'Poids élevé pour l’âge (à interpréter avec la taille)':'Poids normal pour l’âge';
  return(<div>
    <div style={{background:sex==='F'?'#FCE4EC':'#E3F2FD',borderRadius:10,padding:10,marginBottom:10}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:6}}>{sex==='F'?'Courbe de poids — Fille':'Courbe de poids — Garçon'} (normes OMS, 0 à 5 ans)</div>
      <svg viewBox={'0 0 '+W+' '+H} style={{width:'100%',background:'white',borderRadius:6}} role="img" aria-label="Courbe de poids selon l'âge">
        {[0,5,10,15,20,25,30].map(w=><g key={w}><line x1={PL} x2={W-PR} y1={y(w)} y2={y(w)} stroke="#E0E0E0" strokeWidth="1"/><text x={PL-6} y={y(w)+4} fontSize="11" textAnchor="end" fill="#616161">{w}</text></g>)}
        {[0,12,24,36,48,60].map(m=><g key={m}><line x1={x(m)} x2={x(m)} y1={PT} y2={H-PB} stroke="#E0E0E0" strokeWidth="1"/><text x={x(m)} y={H-PB+16} fontSize="11" textAnchor="middle" fill="#616161">{m===0?'Naiss.':(m/12)+' an'+(m>12?'s':'')}</text></g>)}
        <text x={12} y={PT+10} fontSize="11" fill="#616161">kg</text>
        {zs.map(z=><path key={z[0]} d={curve(z[0])} fill="none" stroke={z[1]} strokeWidth={z[0]===0?2:1.5}/>)}
        {zs.map(z=><text key={'l'+z[0]} x={W-PR-2} y={y(Math.min(whoWeight(sex,60,z[0]),30))-3} fontSize="10" textAnchor="end" fill={z[1]}>{z[0]>0?'+'+z[0]:z[0]}</text>)}
        {pts.length>1&&<polyline fill="none" stroke="#1565C0" strokeWidth="2" points={pts.map(p=>x(p.m).toFixed(1)+','+y(Math.min(p.w,30)).toFixed(1)).join(' ')}/>}
        {pts.map((p,i)=><circle key={i} cx={x(p.m)} cy={y(Math.min(p.w,30))} r="4" fill="#1565C0" stroke="white" strokeWidth="1.5"/>)}
      </svg>
    </div>
    {last?<div className="alert alert-info" style={{marginBottom:10}}><span className="alert-icon">📊</span><div className="alert-content"><div className="alert-title">Dernière mesure : {last.w} kg à {fmtAge(last.m)} — z-score {last.z===null?'—':last.z.toFixed(1)}</div><div className="alert-text">{etat(last.z)}. Indication de dépistage : l’interprétation et la conduite à tenir relèvent du professionnel de santé.</div></div></div>
      :<div className="empty-state" style={{padding:16}}><div className="empty-text">Aucune pesée enregistrée (0 à 5 ans)</div></div>}
  </div>);
}

  entries.forEach(e=>{const nom=e.data&&e.data.vaccin;const v=VACCINS_CARNET.find(x=>x.l===nom);if(v&&(!fait[v.id]||e.date_acte<fait[v.id]))fait[v.id]=e.date_acte;});

    {autres.length>0&&<div className="card" style={{marginTop:12}}><div style={{fontWeight:700,fontSize:12,color:'var(--primary)',marginBottom:6}}>AUTRES VACCINS</div>{autres.map(e=><div key={e.id} className="kpi-row"><div style={{fontSize:13}}>{e.data.autre}</div><div style={{fontWeight:700,fontSize:13}}>{fmtDate(e.date_acte)}</div></div>)}</div>}

      {rows.map(f=><tr key={f.k}><td>{f.l}</td>{cols.map(n=>{const v=byV[n].data[f.k];return <td key={n}>{v===undefined||v===''?'—':(v===true?'Oui':String(v))}</td>;})}</tr>)}

function CarnetSante({user,patient,consultations,readOnly}){
  const isub=patient.isub;
  const am=ageMonths(patient.date_naissance);
  const estF=patient.sexe==='F';
  const peutEcrire=!readOnly&&ROLES_ECRITURE_CARNET.indexOf(user.role)>=0;
  const tabs=[['resume','📋','Résumé'],['vaccination','💉','Vaccinations']];
  if(am===null||am<=60)tabs.push(['croissance','📈','Croissance']);
  tabs.push(['soins','🩺','Soins']);
  tabs.push(['famille','👪','Famille'],['antecedents','🧬','Antécédents']);
  if(estF){tabs.push(['gyneco','🤰','Gynéco-obstétrical'],['cpn','🩺','Prénatale'],['accouchement','👶','Accouchement'],['postnatal','🤱','Post-natal / PF']);}
  if(am===null||am<=60)tabs.push(['nutrition','🥗','Nutrition']);
  const[sec,setSec]=useState('resume');
  const[entries,setEntries]=useState(()=>lsGet('snisb_carnet_'+isub,[]));
  const[loading,setLoading]=useState(false);
  const[msg,setMsg]=useState(null);
  const[vals,setVals]=useState({});
  const[dateActe,setDateActe]=useState(todayISO());
  const[errs,setErrs]=useState([]);
  const[ajout,setAjout]=useState(false);
  const[saving,setSaving]=useState(false);

  useEffect(()=>{
    let vivant=true;
    setEntries(lsGet('snisb_carnet_'+isub,[]));setSec('resume');setAjout(false);setMsg(null);
    if(!supaClient)return;
    setLoading(true);
    (async()=>{
      try{
        await carnetFlushOutbox();
        const r=await supaClient.from('carnet_entries').select('*').eq('patient_isub',isub).order('date_acte',{ascending:true});
        if(!vivant)return;
        if(r.error){
          if(r.error.code==='42P01'||(r.error.message||'').indexOf('carnet_entries')>=0)setMsg({t:'warning',m:'La base du carnet n’est pas encore installée (script 06_carnet_schema.sql à exécuter dans Supabase).'});
          else setMsg({t:'warning',m:'Carnet affiché depuis la copie locale : '+(r.error.message||'erreur réseau')});
        }else{
          const att=lsGet(OUTBOX_KEY,[]).filter(x=>x.patient_isub===isub).map(x=>Object.assign({},x,{pending:true}));
          const tous=(r.data||[]).concat(att);
          setEntries(tous);lsSet('snisb_carnet_'+isub,(r.data||[]));
        }
      }catch(e){ if(vivant)setMsg({t:'warning',m:'Hors ligne : carnet affiché depuis la copie locale.'}); }
      if(vivant)setLoading(false);
    })();
    return()=>{vivant=false;};
  },[isub]);

  const changerSection=s=>{setSec(s);setAjout(false);setVals({});setErrs([]);setDateActe(todayISO());};
  const enregistrer=async()=>{
    const er=validerSaisie(sec,vals,dateActe,patient);
    setErrs(er);if(er.length)return;
    setSaving(true);
    const data={};Object.keys(vals).forEach(k=>{if(vals[k]!==''&&vals[k]!==undefined&&vals[k]!==false)data[k]=vals[k];});
    const row={id:uuid(),patient_isub:isub,section:sec,date_acte:dateActe,data:data,zone_sanitaire:user.zone||patient.zone_sanitaire||null,saisi_par:user.nom,saisi_id:user.supabase_id||null};
    let envoye=false,tableManquante=false;
    if(supaClient&&navigator.onLine){
      if(!user.supabase_id){setErrs(['Session Supabase absente : déconnectez-vous puis reconnectez-vous avec votre vrai mot de passe.']);setSaving(false);return;}
      try{
        const{error}=await supaClient.from('carnet_entries').insert(row);
        if(!error||error.code==='23505')envoye=true;
        else{
          const em=(error.message||'')+' '+(error.code||'');
          if(/42P01|PGRST205|schema cache|carnet_entries.*(exist|find)/i.test(em))tableManquante=true;
          else if(/42501|row-level/i.test(em)){setErrs(['Refusé par la base : votre compte n’a pas le droit d’écrire ce carnet (rôle médecin/infirmier requis, patient existant). Détail : '+(error.message||error.code)]);setSaving(false);return;}
          else{setErrs(['Erreur de la base : '+(error.message||error.code)+(error.details?' — '+error.details:'')]);setSaving(false);return;}
        }
      }catch(e){/* panne réseau : file d’attente locale */}
    }
    if(!envoye){
      if(tableManquante){setErrs(['La base du carnet n’est pas prête : exécutez 06_carnet_schema.sql puis 08_teleconsultation_v18.sql (qui recharge le cache) dans Supabase, puis réessayez.']);setSaving(false);return;}
      const box=lsGet(OUTBOX_KEY,[]);box.push(row);lsSet(OUTBOX_KEY,box);
    }
    const ajoute=Object.assign({},row,{pending:!envoye});
    const suite=entries.concat([ajoute]);
    setEntries(suite);
    lsSet('snisb_carnet_'+isub,suite.filter(x=>!x.pending));
    setVals({});setErrs([]);setAjout(false);setDateActe(todayISO());setSaving(false);
    setMsg(envoye?{t:'success',m:'Enregistré dans le carnet.'}:{t:'warning',m:'Enregistré sur cet appareil. Envoi automatique dès le retour de la connexion.'});
  };

  useEffect(()=>{
    const on=()=>{carnetFlushOutbox().then(r=>{if(r.sent>0)setEntries(prev=>prev.map(x=>x.pending?Object.assign({},x,{pending:false}):x));});};
    window.addEventListener('online',on);
    return()=>{window.removeEventListener('online',on);};
  },[]);

  const duSection=s=>entries.filter(e=>e.section===s).sort((a,b)=>String(a.date_acte).localeCompare(String(b.date_acte)));
  const def=CARNET_SECTIONS[sec];
  const liste=def?duSection(sec):[];

  return(<div>
    <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:12}} role="tablist">
      {tabs.map(t=><button key={t[0]} role="tab" aria-selected={sec===t[0]} className={'inner-tab '+(sec===t[0]?'active':'')} onClick={()=>changerSection(t[0])}>{t[1]} {t[2]}</button>)}
    </div>
    {msg&&<div className={'alert alert-'+msg.t} style={{marginBottom:10}}><span className="alert-icon">{msg.t==='success'?'✅':'⚠️'}</span><div className="alert-content"><div className="alert-text">{msg.m}</div></div></div>}
    {loading&&<div style={{fontSize:12,color:'var(--text-muted)',marginBottom:8}}>Chargement du carnet…</div>}

    {sec==='resume'&&<div className="grid-2">
      <div className="card"><div className="card-title">🪪 Identification</div>
        <div className="kpi-row"><div>Département</div><strong>{patient.departement||'—'}</strong></div>
        <div className="kpi-row"><div>Zone sanitaire</div><strong>{patient.zone_nom||patient.zone_sanitaire||'—'}</strong></div>
        <div className="kpi-row"><div>Date de naissance</div><strong>{fmtDate(patient.date_naissance)}</strong></div>
        <div className="kpi-row"><div>Âge</div><strong>{fmtAge(am)}</strong></div>
        <div className="kpi-row"><div>Sexe</div><strong>{patient.sexe==='F'?'Féminin':patient.sexe==='M'?'Masculin':'—'}</strong></div>
        {(()=>{const f=duSection('famille');const d=f.length?f[f.length-1].data:{};return <>
          <div className="kpi-row"><div>Commune</div><strong>{d.commune||'—'}</strong></div>
          <div className="kpi-row"><div>Formation sanitaire</div><strong>{d.formation_sanitaire||'—'}</strong></div></>;})()}
      </div>
      <div className="card"><div className="card-title">📌 Où en est le carnet</div>
        <div className="kpi-row"><div>Vaccins enregistrés</div><strong>{duSection('vaccination').length}</strong></div>
        <div className="kpi-row"><div>Pesées enregistrées</div><strong>{duSection('croissance').length}</strong></div>
        <div className="kpi-row"><div>Consultations de soins</div><strong>{consultations.filter(c=>c.patient_isub===isub).length}</strong></div>
        {estF&&<div className="kpi-row"><div>Consultations prénatales</div><strong>{duSection('cpn').length}</strong></div>}
        <div style={{fontSize:11,color:'var(--text-muted)',marginTop:8}}>Modèle : carnet de santé du Ministère de la Santé du Bénin. Les inscriptions sont horodatées et attribuées à leur auteur ; elles ne sont pas modifiables.</div>
      </div>
    </div>}

    {sec==='soins'&&<div className="card"><div className="card-title">🩺 Carnet de soins — consultations</div><CarnetSoins consultations={consultations} isub={isub}/></div>}

    {def&&<div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,gap:8,flexWrap:'wrap'}}>
        <div className="card-title" style={{marginBottom:0}}>{def.icon} {def.label}</div>
        {peutEcrire&&!ajout&&<button className="btn btn-primary btn-sm" onClick={()=>{setAjout(true);setVals({});setErrs([]);}}>➕ Ajouter</button>}
      </div>
      {ajout&&<div style={{background:'var(--light)',borderRadius:10,padding:14,marginBottom:14}}>
        <div className="form-group" style={{maxWidth:240}}><label className="form-label" htmlFor="cf_date">Date *</label><input id="cf_date" className="form-input" type="date" max={todayISO()} value={dateActe} onChange={e=>setDateActe(e.target.value)}/></div>
        <CarnetChampsForm sec={sec} vals={vals} setVals={setVals}/>
        {errs.length>0&&<div className="alert alert-danger" style={{marginTop:10}}><span className="alert-icon">❌</span><div className="alert-content">{errs.map((x,i)=><div key={i} className="alert-text">{x}</div>)}</div></div>}
        <div style={{display:'flex',gap:8,marginTop:12}}><button className="btn btn-primary" disabled={saving} onClick={enregistrer}>{saving?'Enregistrement…':'💾 Enregistrer'}</button><button className="btn btn-outline" onClick={()=>{setAjout(false);setErrs([]);}}>Annuler</button></div>
      </div>}
      {sec==='vaccination'&&<CarnetVaccinGrille entries={liste}/>}

        :liste.slice().reverse().map(e=><CarnetEntree key={e.id} e={e} sec={sec}/>))}
    </div>}

}
