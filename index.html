// PYRAMIDE SANITAIRE DU BÉNIN + SANTÉ COMMUNAUTAIRE
// Sources : Décret n° 2022-148 du 02 mars 2022 portant organisation de la pyramide sanitaire (art. 3 à 26) ;
//           Politique nationale de santé communautaire (ASCQ, relais communautaires, SIBC intégré au SNIGS).
// ═══════════════════════════════════════
const PYRAMIDE=[
  {niveau:'central',titre:'Niveau central',ref:'Décret 2022-148, art. 23 à 26',
   structures:['Ministère de la Santé : cabinet, secrétariat général, directions centrales et techniques, agences','Hôpitaux nationaux de dernière référence (soins très spécialisés, formation universitaire, recherche)'],
   role:'Pilotage, politiques, données nationales.',snisb:['Administrateur national','Statisticien SNIS']},
  {niveau:'intermediaire',titre:'Niveau intermédiaire (département)',ref:'Décret 2022-148, art. 18 à 22',
   structures:['Direction départementale de la santé : supervise les zones sanitaires et appuie les communes','Centre hospitalier départemental (CHD) : référence départementale, médecine et chirurgie spécialisées, urgences et réanimation'],
   role:'Supervision des zones sanitaires, plan d’action départemental.',snisb:['Superviseur']},
  {niveau:'peripherique',titre:'Niveau périphérique (zone sanitaire)',ref:'Décret 2022-148, art. 5 à 17',
   structures:['Structures de premier contact : centres de santé d’arrondissement ou de commune, maternités et dispensaires isolés, services de santé communautaire, infirmeries, cabinets et cliniques','Hôpital de commune (certaines communes enclavées)','Hôpital de zone : structure de référence de la zone (médecine générale, chirurgie générale, obstétrique, pédiatrie, urgences)','Bureau de coordination de zone, placé sous l’autorité du directeur départemental de la santé'],
   role:'Soins de premier contact et première référence ; une zone couvre plusieurs arrondissements d’une ou plusieurs communes.',snisb:['Médecin','Infirmier / Sage-femme']},
  {niveau:'communautaire',titre:'Niveau communautaire (village ou quartier de ville)',ref:'Politique nationale de santé communautaire',
   structures:['Agent de santé communautaire qualifié (ASCQ) : encadre en moyenne trois relais ; recruté par la mairie, mis à disposition des aires de santé','Relais communautaire : volontaire choisi par sa communauté, visite les ménages, conseille, oriente et aide à la référence','Tutelle technique : le chef de poste du centre de santé de l’aire ; les données remontent vers le centre de santé puis le SNIGS'],
   role:'Promotion de la santé, repérage des cas, orientation, information à base communautaire.',snisb:['Agent de santé communautaire qualifié','Relais communautaire']}
];
const CAT_SIG={
  maladie_surveillance:'Cas suspect de maladie sous surveillance (SIMR)',
  femme_enceinte:'Femme enceinte à orienter vers le centre de santé',
  enfant_malnutri:'Enfant suspect de malnutrition',
  enfant_non_vaccine:'Enfant non vacciné ou perdu de vue',
  deces:'Décès dans la communauté',
  evenement_inhabituel:'Événement ou rumeur inhabituelle'
};
const STRUCTURES_TYPES=['Centre de santé d’arrondissement','Centre de santé de commune','Hôpital de commune','Hôpital de zone','Maternité / dispensaire isolé','Service de santé communautaire','Bureau de coordination de zone','Direction départementale de la santé','Centre hospitalier départemental (CHD)','Niveau central (Ministère)'];
const SIG_OUTBOX='snisb_sig_outbox';

function PyramideSanitaire({user}){
  const mon=user.niveau||(ROLES[user.role]&&ROLES[user.role].niveau)||'';
  return(<div>
    <p className="page-title">🏛️ Pyramide sanitaire du Bénin</p>
    <p className="page-sub">L’organisation officielle du système de santé, et la place de chaque rôle SNISB dans cette pyramide.</p>
    {PYRAMIDE.map((n,i)=><div key={n.niveau} className="card" style={{borderLeft:'5px solid '+(n.niveau===mon?'var(--primary)':'var(--border)'),background:n.niveau===mon?'#F1F8F4':undefined}}>
      <div style={{display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
        <div className="card-title" style={{marginBottom:6}}>{n.titre}{n.niveau===mon&&<span className="badge badge-success" style={{marginLeft:8}}>Votre niveau</span>}</div>
        <span style={{fontSize:11,color:'var(--text-muted)'}}>{n.ref}</span>
      </div>
      <div style={{fontSize:13,marginBottom:6}}>{n.role}</div>
      <ul style={{fontSize:13,paddingLeft:18,margin:'0 0 8px'}}>{n.structures.map((s,j)=><li key={j} style={{marginBottom:3}}>{s}</li>)}</ul>
      <div style={{fontSize:12}}><strong>Rôles SNISB :</strong> {n.snisb.join(' • ')}</div>
      {i<PYRAMIDE.length-1&&<div style={{textAlign:'center',fontSize:11,color:'var(--text-muted)',marginTop:8}}>↓ référence des cas vers le haut ↑ — supervision vers le bas</div>}
    </div>)}
    <div className="alert alert-info"><div className="alert-content"><div className="alert-title">Circuit de l’information</div><div className="alert-text">Relais communautaire → agent de santé communautaire → chef de poste du centre de santé (validation) → zone sanitaire → direction départementale → niveau central. Dans SNISB, un signalement communautaire n’entre dans la surveillance qu’après confirmation par un agent de santé.</div></div></div>
    <div className="form-hint">Sources : Décret n° 2022-148 du 02 mars 2022 portant organisation de la pyramide sanitaire (le décret ne décrit pas de circuit de référence formel ; celui-ci découle de la structure) ; Politique nationale de santé communautaire du Bénin. Le niveau communautaire est décrit dans la politique de santé communautaire, non dans le décret.</div>
  </div>);
}

function SanteCommunautaire({user}){
  const estAuteur=user.role==='relais'||user.role==='asc';
  const peutValider=['medecin','infirmier','admin','superviseur'].includes(user.role);
  const enligne=!!(supaClient&&user.supabase_id);
  const aujourdhui=new Date().toISOString().slice(0,10);
  const vide={village:user.village||'',date_evenement:aujourdhui,categorie:'maladie_surveillance',maladie_code:'',nb_cas:'1',nb_deces:'0',nb_orientes:'0',description:''};
  const[items,setItems]=useState([]);
  const[attente,setAttente]=useState(()=>lsGet(SIG_OUTBOX,[]));
  const[loadErr,setLoadErr]=useState('');
  const[form,setForm]=useState(vide);
  const[errs,setErrs]=useState([]);
  const[msg,setMsg]=useState(null);
  const[busy,setBusy]=useState(false);
  const[tab,setTab]=useState(peutValider?'avalider':'saisie');
  const[rejetId,setRejetId]=useState(null);const[motif,setMotif]=useState('');

  const charger=async()=>{
    if(!enligne)return;
    try{
      const{data,error}=await supaClient.from('signalements_communautaires').select('*').order('created_at',{ascending:false}).limit(300);
      if(error){setLoadErr(/signalements_communautaires|42P01|PGRST205/i.test(error.code+' '+(error.message||''))?'Le module communautaire n’est pas installé : exécutez 12_pyramide_communautaire.sql dans Supabase.':'Chargement impossible : '+error.message);return;}
      setLoadErr('');setItems(data||[]);
    }catch(e){setLoadErr('Réseau indisponible — les signalements déjà saisis restent affichés.');}
  };
  const envoyerAttente=async()=>{
    const box=lsGet(SIG_OUTBOX,[]);if(!box.length||!enligne||!navigator.onLine)return;
    const restant=[];
    for(const r of box){
      try{const{error}=await supaClient.from('signalements_communautaires').insert(r);if(error&&error.code!=='23505')restant.push(r);}
      catch(e){restant.push(r);}
    }
    lsSet(SIG_OUTBOX,restant);setAttente(restant);if(restant.length<box.length)charger();
  };
  useEffect(()=>{
    charger();envoyerAttente();
    const t=setInterval(charger,20000);
    const on=()=>{envoyerAttente();};
    window.addEventListener('online',on);
    return()=>{clearInterval(t);window.removeEventListener('online',on);};
  },[]);

  const maladie=MALADIES_SIMR.find(m=>m.code===form.maladie_code)||null;
  const valider=()=>{
    const e=[];
    if(!form.village.trim())e.push('Indiquez le village ou quartier.');
    if(form.date_evenement>aujourdhui)e.push('La date ne peut pas être dans le futur.');
    if(form.categorie==='maladie_surveillance'&&!maladie)e.push('Choisissez la maladie suspectée.');
    ['nb_cas','nb_deces','nb_orientes'].forEach(k=>{const v=Number(form[k]);if(!Number.isInteger(v)||v<0)e.push('Les nombres doivent être des entiers positifs ou nuls.');});
    if(Number(form.nb_orientes)>Number(form.nb_cas))e.push('Le nombre de personnes orientées ne peut pas dépasser le nombre de cas.');
    if(Number(form.nb_cas)<1&&form.categorie!=='evenement_inhabituel')e.push('Indiquez au moins 1 cas.');
    if(form.categorie==='evenement_inhabituel'&&form.description.trim().length<10)e.push('Décrivez l’événement (10 caractères minimum).');
    return Array.from(new Set(e));
  };
  const envoyer=async()=>{
    const e=valider();setErrs(e);if(e.length||busy)return;
    setBusy(true);setMsg(null);
    const row={id:uuid(),auteur_id:user.supabase_id||null,auteur_nom:user.nom,auteur_role:user.role,zone_sanitaire:user.zone||null,departement:user.dept||null,commune:user.commune||null,arrondissement:user.arrondissement||null,
      village:form.village.trim(),date_evenement:form.date_evenement,categorie:form.categorie,
      maladie_code:form.categorie==='maladie_surveillance'?maladie.code:null,maladie_nom:form.categorie==='maladie_surveillance'?maladie.nom:null,maladie_notif:form.categorie==='maladie_surveillance'?maladie.notif:null,
      nb_cas:Number(form.nb_cas),nb_deces:Number(form.nb_deces),nb_orientes:Number(form.nb_orientes),description:form.description.trim()||null,statut:'soumis'};
    if(!user.supabase_id){setErrs(['Session absente : déconnectez-vous puis reconnectez-vous.']);setBusy(false);return;}
    let envoye=false;
    if(enligne&&navigator.onLine){
      try{
        const{error}=await supaClient.from('signalements_communautaires').insert(row);
        if(!error||error.code==='23505')envoye=true;
        else{
          const em=(error.message||'')+' '+(error.code||'');
          if(/42P01|PGRST205|schema cache/i.test(em))setErrs(['Le module communautaire n’est pas prêt : exécutez 12_pyramide_communautaire.sql dans Supabase.']);
          else if(/42501|row-level/i.test(em))setErrs(['Refusé par la base : votre compte doit être un relais ou un ASCQ rattaché à une zone sanitaire.']);
          else setErrs(['Erreur de la base : '+(error.message||error.code)]);
          setBusy(false);return;
        }
      }catch(x){/* panne réseau : mise en attente locale */}
    }
    if(!envoye){const box=lsGet(SIG_OUTBOX,[]);box.push(row);lsSet(SIG_OUTBOX,box);setAttente(box);}
    setForm(Object.assign({},vide,{village:form.village}));setErrs([]);setBusy(false);
    setMsg(envoye?{t:'success',m:'Signalement envoyé. Un agent de santé de votre centre va le vérifier.'}:{t:'warning',m:'Pas de réseau : signalement gardé sur cet appareil. Il partira automatiquement dès le retour de la connexion.'});
    if(envoye)charger();
  };

  const decider=async(s,statut,motifRejet)=>{
    if(!enligne||busy)return;
    if(statut==='rejete'&&(motifRejet||'').trim().length<3){setMsg({t:'danger',m:'Indiquez le motif du rejet.'});return;}
    setBusy(true);setMsg(null);
    const{data,error}=await supaClient.from('signalements_communautaires').update({statut:statut,valide_par:user.nom,valide_id:user.supabase_id,motif_rejet:statut==='rejete'?motifRejet.trim():null}).eq('id',s.id).eq('statut','soumis').select();
    setBusy(false);
    if(error){setMsg({t:'danger',m:'Action impossible : '+(error.message||'')});return;}
    if(!data||data.length===0){setMsg({t:'warning',m:'Ce signalement a déjà été traité ou n’est pas dans votre zone.'});await charger();return;}
    setRejetId(null);setMotif('');
    setMsg({t:'success',m:statut==='confirme'?('Signalement confirmé par '+user.nom+(s.maladie_notif==='immédiate'?' — une alerte épidémique a été ouverte (onglet Épidémiologie).':'.')):'Signalement rejeté.'});
    await charger();
  };

  const aValider=items.filter(x=>x.statut==='soumis');
  const confirmes=items.filter(x=>x.statut==='confirme');
  const parVillage={};
  confirmes.forEach(x=>{const k=(x.village||'—')+'|'+(x.commune||'')+'|'+(x.zone_sanitaire||'');const o=parVillage[k]||(parVillage[k]={village:x.village,commune:x.commune,zone:x.zone_sanitaire,cas:0,deces:0,orientes:0,n:0});o.cas+=x.nb_cas;o.deces+=x.nb_deces;o.orientes+=x.nb_orientes;o.n+=1;});
  const lignes=Object.values(parVillage).sort((a,b)=>b.cas-a.cas);
  const exporterCSV=()=>{
    const cols=['date_evenement','zone_sanitaire','commune','arrondissement','village','categorie','maladie_code','maladie_nom','nb_cas','nb_deces','nb_orientes','auteur_nom','valide_par','valide_at'];
    const esc=v=>{const s=v==null?'':String(v);return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
    const csv='﻿'+[cols.join(';')].concat(confirmes.map(r=>cols.map(c=>esc(r[c])).join(';'))).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='signalements_communautaires_confirmes.csv';document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);},200);
  };
  const badge=s=><span className={'badge '+(s==='confirme'?'badge-success':s==='rejete'?'badge-immediate':'badge-hebdo')}>{s==='confirme'?'Confirmé':s==='rejete'?'Rejeté':'À vérifier'}</span>;
  const carte=(s,actions)=><div key={s.id} className="consultation-item">
    <div style={{display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}><div className="consultation-date">{fmtDate(s.date_evenement)} — {s.village}{s.commune?' ('+s.commune+')':''}</div>{badge(s.statut)}</div>
    <div style={{fontWeight:600,fontSize:13,marginTop:2}}>{CAT_SIG[s.categorie]||s.categorie}{s.maladie_nom?' : '+s.maladie_nom:''}{s.maladie_notif==='immédiate'&&<span className="badge badge-immediate" style={{marginLeft:6}}>Notification immédiate</span>}</div>
    <div style={{fontSize:12,margin:'2px 0'}}>{s.nb_cas} cas • {s.nb_deces} décès • {s.nb_orientes} orienté(s) vers un centre de santé</div>
    {s.description&&<div style={{fontSize:13}}>{s.description}</div>}
    <div style={{fontSize:11,color:'var(--text-muted)',marginTop:4}}>Saisi par {s.auteur_nom} ({s.auteur_role==='asc'?'ASCQ':'relais'}){s.valide_par?' • Traité par '+s.valide_par:''}{s.motif_rejet?' • Motif du rejet : '+s.motif_rejet:''}</div>
    {actions}
  </div>;
  const Msg=()=>msg?<div className={'alert alert-'+(msg.t==='danger'?'danger':msg.t==='warning'?'warning':'success')}><div className="alert-content"><div className="alert-text">{msg.m}</div></div></div>:null;

  return(<div>
    <p className="page-title">🏘️ Santé communautaire</p>
    <p className="page-sub">{estAuteur?'Signalez ce que vous constatez dans votre village. Un agent de santé du centre de santé vérifie avant que l’information entre dans la surveillance.':'Signalements des relais communautaires et des agents de santé communautaires qualifiés de votre zone.'}</p>
    {loadErr&&<div className="alert alert-warning"><div className="alert-content"><div className="alert-text">{loadErr}</div></div></div>}
    <Msg/>
    {attente.length>0&&<div className="alert alert-info"><div className="alert-content"><div className="alert-text">⏳ {attente.length} signalement(s) en attente d’envoi sur cet appareil.</div></div></div>}
    <div className="inner-tabs">
      {(estAuteur?[['saisie','Nouveau signalement'],['liste','Mes signalements ('+items.length+')']]:[]).concat(estAuteur?[]:[['avalider','À vérifier ('+aValider.length+')'],['synthese','Synthèse par village'],['liste','Historique ('+items.length+')']]).map(([t,l])=><button key={t} className={'inner-tab '+(tab===t?'active':'')} onClick={()=>setTab(t)}>{l}</button>)}
    </div>

    {estAuteur&&tab==='saisie'&&<div className="card">
      <div className="card-title">Nouveau signalement</div>
      {errs.length>0&&<div className="alert alert-danger"><div className="alert-content">{errs.map((x,i)=><div key={i} className="alert-text">{x}</div>)}</div></div>}
      <div className="form-row">
        <div className="form-group"><label className="form-label">Village ou quartier *</label><input className="form-input" value={form.village} onChange={e=>setForm(Object.assign({},form,{village:e.target.value}))}/></div>
        <div className="form-group"><label className="form-label">Date de l’événement *</label><input className="form-input" type="date" max={aujourdhui} value={form.date_evenement} onChange={e=>setForm(Object.assign({},form,{date_evenement:e.target.value}))}/></div>
      </div>
      <div className="form-group"><label className="form-label">Que signalez-vous ? *</label>
        <select className="form-select" value={form.categorie} onChange={e=>setForm(Object.assign({},form,{categorie:e.target.value,maladie_code:''}))}>{Object.keys(CAT_SIG).map(k=><option key={k} value={k}>{CAT_SIG[k]}</option>)}</select></div>
      {form.categorie==='maladie_surveillance'&&<div className="form-group"><label className="form-label">Maladie suspectée *</label>
        <select className="form-select" value={form.maladie_code} onChange={e=>setForm(Object.assign({},form,{maladie_code:e.target.value}))}><option value="">— Choisir —</option>{MALADIES_SIMR.map(m=><option key={m.code} value={m.code}>{m.nom} ({m.code})</option>)}</select></div>}
      {maladie&&maladie.notif==='immédiate'&&<div className="alert alert-warning"><div className="alert-content"><div className="alert-title">Maladie à notification immédiate</div><div className="alert-text">Prévenez tout de suite le chef de poste du centre de santé (téléphone ou en personne). Ce formulaire ne remplace pas cet appel.</div></div></div>}
      <div className="form-row">
        <div className="form-group"><label className="form-label">Nombre de cas</label><input className="form-input" type="number" min="0" value={form.nb_cas} onChange={e=>setForm(Object.assign({},form,{nb_cas:e.target.value}))}/></div>
        <div className="form-group"><label className="form-label">dont décès</label><input className="form-input" type="number" min="0" value={form.nb_deces} onChange={e=>setForm(Object.assign({},form,{nb_deces:e.target.value}))}/></div>
        <div className="form-group"><label className="form-label">Orientés vers le centre</label><input className="form-input" type="number" min="0" value={form.nb_orientes} onChange={e=>setForm(Object.assign({},form,{nb_orientes:e.target.value}))}/></div>
      </div>
      <div className="form-group"><label className="form-label">Description (facultatif)</label><textarea className="form-textarea" placeholder="Ce que vous avez vu, depuis quand..." value={form.description} onChange={e=>setForm(Object.assign({},form,{description:e.target.value}))}/></div>
      <button className="btn btn-primary" onClick={envoyer} disabled={busy}>{busy?'Envoi...':'📤 Envoyer le signalement'}</button>
      <div className="form-hint">Signé à votre nom ({user.nom}), horodaté, et non modifiable après envoi. N’écrivez aucun nom de personne : seulement des nombres.</div>
    </div>}

    {!estAuteur&&tab==='avalider'&&<div className="card">
      {aValider.length===0?<div className="empty-state"><div className="empty-icon material-symbols-rounded">inbox</div><div className="empty-text">Aucun signalement à vérifier</div></div>
        :aValider.map(s=>carte(s,peutValider?<div style={{marginTop:8}}>
          {rejetId===s.id?<div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            <input className="form-input" style={{flex:1,minWidth:180}} placeholder="Motif du rejet *" value={motif} onChange={e=>setMotif(e.target.value)}/>
            <button className="btn btn-sm btn-danger" disabled={busy} onClick={()=>decider(s,'rejete',motif)}>Rejeter</button>
            <button className="btn btn-sm btn-outline" onClick={()=>{setRejetId(null);setMotif('');}}>Annuler</button>
          </div>:<div style={{display:'flex',gap:6}}>
            <button className="btn btn-sm btn-primary" disabled={busy} onClick={()=>decider(s,'confirme','')}>✔ Confirmer</button>
            <button className="btn btn-sm btn-outline" onClick={()=>{setRejetId(s.id);setMotif('');}}>Rejeter…</button>
          </div>}
        </div>:null))}
      <div className="form-hint" style={{marginTop:8}}>Confirmer = vous avez vérifié l’information (appel au relais, visite, cohérence). Une maladie à notification immédiate confirmée ouvre une alerte épidémique à votre nom.</div>
    </div>}

    {!estAuteur&&tab==='synthese'&&<div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><div className="card-title">Signalements confirmés par village</div>
        <button className="btn btn-outline btn-sm" onClick={exporterCSV} disabled={confirmes.length===0}>⬇️ Exporter (CSV)</button></div>
      {lignes.length===0?<div className="empty-state"><div className="empty-text">Aucun signalement confirmé pour le moment</div></div>
        :<div className="table-wrap"><table><thead><tr><th>Village</th><th>Commune</th><th>Zone</th><th>Signalements</th><th>Cas</th><th>Décès</th><th>Orientés</th></tr></thead>
          <tbody>{lignes.map((l,i)=><tr key={i}><td><strong>{l.village}</strong></td><td>{l.commune||'—'}</td><td>{l.zone||'—'}</td><td>{l.n}</td><td>{l.cas}</td><td>{l.deces}</td><td>{l.orientes}</td></tr>)}</tbody></table></div>}
      <div className="form-hint">L’export CSV sert de base de transmission ; l’envoi vers DHIS2 (SNIGS) demande les codes officiels des éléments de données du Bénin, à intégrer avec la direction en charge du SNIGS.</div>
    </div>}

    {tab==='liste'&&<div className="card">
      {items.length===0&&attente.length===0?<div className="empty-state"><div className="empty-text">Aucun signalement</div></div>:items.map(s=>carte(s,null))}
    </div>}
  </div>);
}

// ═══════════════════════════════════════
// APP PRINCIPALE
// ═══════════════════════════════════════
function App(){
  const[user,setUser]=useState(null);
  const[tab,setTab]=useState('dashboard');
  const[online,setOnline]=useState(navigator.onLine);
  const[db,setDb]=useState(null);
  const[patients,setPatients]=useState([]);
  const[consultations,setConsultations]=useState([]);
  const[rappels,setRappels]=useState([]);
  const[ready,setReady]=useState(false);
  const[syncPending,setSyncPending]=useState(0);
  const[pwaPrompt,setPwaPrompt]=useState(null);

  // Init IndexedDB — avec filet de sécurité : si IndexedDB reste bloqué
  // (ex: origine restreinte, fichier ouvert en local), l'app démarre quand
  // même après 4s, sans stockage persistant plutôt que de bloquer indéfiniment.
  useEffect(()=>{
    let done=false;
    const finish=()=>{ if(!done){ done=true; setReady(true); } };
    const timeout=setTimeout(finish,4000);
    const manager=new DB();
    manager.init().then(async()=>{
      if(done)return;
      setDb(manager);
      const[p,c,r]=await Promise.all([manager.getAll('patients'),manager.getAll('consultations'),manager.getAll('rappels')]);
      if(done)return;
      setPatients(p);setConsultations(c);setRappels(r);
      clearTimeout(timeout);finish();
    }).catch(()=>{clearTimeout(timeout);finish();});
  },[]);

  // Online/offline
  useEffect(()=>{
    const on=()=>{setOnline(true);syncWithSupabase();};
    const off=()=>setOnline(false);
    window.addEventListener('online',on);window.addEventListener('offline',off);
    return()=>{window.removeEventListener('online',on);window.removeEventListener('offline',off);};
  },[]);

  // PWA install prompt
  useEffect(()=>{
    const handler=e=>{e.preventDefault();setPwaPrompt(e);};
    window.addEventListener('beforeinstallprompt',handler);
    return()=>window.removeEventListener('beforeinstallprompt',handler);
  },[]);

  // Supabase realtime (si disponible)
  useEffect(()=>{
    if(!supaClient||!user)return;
    const channel=supaClient.channel('snisb-realtime')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'consultations'},payload=>{
        setConsultations(prev=>{if(prev.find(c=>c.id===payload.new.id))return prev;return[payload.new,...prev];});
      })
      .subscribe();
    return()=>{ try{ supaClient.removeChannel(channel); }catch(e){} };
  },[user]);

  const syncWithSupabase=async()=>{
    if(!supaClient||!db)return;
    try{
      const{data:remoteC}=await supaClient.from('consultations').select('*').order('created_at',{ascending:false}).limit(100);
      const{data:remoteP}=await supaClient.from('patients').select('*').limit(200);
      if(remoteC){for(const c of remoteC)await db.put('consultations',c);setConsultations(remoteC);}
      if(remoteP){for(const p of remoteP)await db.put('patients',p);setPatients(remoteP);}
      setSyncPending(0);
    }catch(e){console.log('Sync error:',e);}
  };

  // Synchronisation initiale après connexion (patients et consultations visibles par ce compte)
  useEffect(()=>{
    if(!user||!db||!supaClient)return;
    syncWithSupabase();
  },[user,db]);

  const installPwa=async()=>{
    if(!pwaPrompt)return;
    pwaPrompt.prompt();
    const{outcome}=await pwaPrompt.userChoice;
    if(outcome==='accepted')setPwaPrompt(null);
  };

  const login=c=>{setUser(c);setTab(c.role==='patient'?'carnet':(c.role==='relais'||c.role==='asc')?'communautaire':c.role==='superviseur'?'dashboard':'dashboard');};
  const logout=()=>{setUser(null);setTab('dashboard');if(supaClient)supaClient.auth.signOut();};

  const alerts=consultations.filter(c=>matchMaladie(c.diagnostic)?.notif==='immédiate').length;

  if(!ready)return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'#0F8B4C'}}>
      <div style={{fontSize:64,marginBottom:16}}>🏥</div>
      <div className="spinner" style={{borderTopColor:'white',borderColor:'rgba(255,255,255,0.3)'}}/>
      <p style={{color:'white',marginTop:16,fontWeight:700,fontSize:16}}>SNISB Health Link</p>
      <p style={{color:'rgba(255,255,255,0.7)',fontSize:12,marginTop:4}}>Initialisation du système...</p>
    </div>
  );

  if(!user)return <Login onLogin={login}/>;
  if(user.must_change)return <ChangePassword user={user} onDone={()=>setUser(u=>Object.assign({},u,{must_change:false}))} onLogout={logout}/>;

  const renderTab=()=>{
    const props={user,patients,setPatients,consultations,setConsultations,rappels,setRappels,db};
    switch(tab){
      case 'dashboard':return<Dashboard user={user} patients={patients} consultations={consultations}/>;
      case 'patients':return<Patients {...props}/>;
      case 'consultations':return<Consultations {...props}/>;
      case 'teleconsultation':return<Teleconsultation user={user} patients={patients}/>;
      case 'dossiers':return<Dossiers patients={patients} consultations={consultations}/>;
      case 'rappels':return<Rappels {...props}/>;
      case 'export':return<Export consultations={consultations} patients={patients}/>;
      case 'epidemio':return<Epidemio user={user} consultations={consultations}/>;
      case 'carte':return<Carte consultations={consultations}/>;
      case 'ia':return<IAClinique user={user} patients={patients} consultations={consultations}/>;
      case 'formation':return<Formation user={user}/>;
      case 'admin':return<Admin user={user} patients={patients} consultations={consultations}/>;
      case 'communautaire':return<SanteCommunautaire user={user}/>;
      case 'pyramide':return<PyramideSanitaire user={user}/>;
      case 'carnet_sante':return<CarnetStaff user={user} patients={patients} consultations={consultations}/>;
      case 'carnet':case 'sante':return<Carnet user={user} consultations={consultations} patients={patients}/>;
      default:return<Dashboard user={user} patients={patients} consultations={consultations}/>;
    }
  };

  return(
    <div className="app-layout">
      {pwaPrompt&&(
        <div className="pwa-banner">
          <span style={{fontSize:20}}>📱</span>
          <div style={{flex:1}}><strong>Installer SNISB Health Link</strong> comme application sur votre appareil — fonctionne sans Internet !</div>
          <button className="btn btn-sm" style={{background:'white',color:'var(--primary)',fontWeight:700}} onClick={installPwa}>Installer</button>
          <button className="btn-icon" style={{background:'rgba(255,255,255,0.2)'}} onClick={()=>setPwaPrompt(null)}>×</button>
        </div>
      )}
      <Header user={user} online={online} onLogout={logout} syncPending={syncPending}/>
      <div className="app-body">
        <Nav user={user} active={tab} onChange={setTab} alerts={alerts}/>
        <main className="main">{renderTab()}</main>
      </div>
      {!online&&(
        <div className="offline-banner">
          📵 Mode hors-ligne — Données sauvegardées localement (IndexedDB) — Synchronisation Supabase automatique au retour de connexion
        </div>
      )}
    </div>
  );
}

class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(e){return{error:e};}
  render(){
    if(this.state.error){
      return React.createElement('div',{style:{padding:40,fontFamily:'sans-serif',textAlign:'center',background:'#fff',minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}},
        React.createElement('div',{style:{fontSize:48,marginBottom:16}},'🏥'),
        React.createElement('h2',{style:{color:'#E74C3C',marginBottom:8}},'Erreur de chargement SNISB'),
        React.createElement('p',{style:{color:'#666',marginBottom:16,fontSize:13}},this.state.error.message||'Erreur inconnue'),
        React.createElement('button',{style:{background:'#00853E',color:'white',border:'none',padding:'12px 24px',borderRadius:8,cursor:'pointer',fontSize:14},onClick:()=>window.location.reload()},'🔄 Recharger')
      );
    }
    return this.props.children;
  }
}

// ═══════════════════════════════════════
// SYSTÈME D'ICÔNES — Material Symbols Rounded
// Remplace les emojis par des icônes cohérentes après chaque rendu,
// sans toucher à la logique des composants (post-traitement DOM sûr).
// ═══════════════════════════════════════
const EMOJI_TO_ICON = {
  '🏥':'local_hospital','⚕':'local_hospital','📊':'bar_chart','👤':'person','👥':'group',
  '👨':'medical_services','👩':'medical_services','🩺':'stethoscope','📋':'assignment',
  '🔔':'notifications','📤':'upload_file','🦠':'coronavirus','📚':'school','📓':'menu_book',
  '❤':'favorite','🚪':'logout','🔐':'lock','🔒':'lock','✅':'check_circle','❌':'cancel',
  '⚠':'warning','🚨':'emergency','💊':'medication','💉':'vaccines','📅':'calendar_month',
  '🔄':'sync','🗺':'map','🤖':'smart_toy','💧':'water_drop','🦟':'pest_control',
  '🧼':'clean_hands','📞':'call','⭐':'star','🎯':'track_changes','📈':'trending_up',
  '📕':'picture_as_pdf','🔗':'link','📜':'history','🌡':'thermostat','💓':'monitor_heart',
  '🏆':'emoji_events','🏅':'military_tech','📝':'edit_note','🔍':'search','➕':'add',
  '🗑':'delete','⚙':'settings','💾':'save','📄':'description','📖':'auto_stories',
  '📱':'smartphone','📵':'wifi_off','✏':'edit','💡':'lightbulb','🏃':'directions_run',
  '🥗':'restaurant','👑':'shield_person','⚡':'bolt','📍':'location_on',
  '🔴':'circle','🟡':'circle','🟢':'circle'
};
function applyIconSystem(){
  const root=document.getElementById('root');
  if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  const targets=[];
  let node;
  while((node=walker.nextNode())){
    if(node.parentElement&&node.parentElement.classList&&node.parentElement.classList.contains('material-symbols-rounded'))continue;
    for(const emoji of Object.keys(EMOJI_TO_ICON)){
      if(node.nodeValue.indexOf(emoji)!==-1){ targets.push(node); break; }
    }
  }
  targets.forEach(textNode=>{
    const parts=[];
    let remaining=textNode.nodeValue;
    let matched=true;
    while(matched&&remaining.length){
      matched=false;
      for(const emoji of Object.keys(EMOJI_TO_ICON)){
        const idx=remaining.indexOf(emoji);
        if(idx===-1)continue;
        if(parts.length===0||true){
          if(idx>0)parts.push({type:'text',v:remaining.slice(0,idx)});
          parts.push({type:'icon',v:EMOJI_TO_ICON[emoji]});
          remaining=remaining.slice(idx+emoji.length);
          matched=true;
          break;
        }
      }
    }
    if(remaining.length)parts.push({type:'text',v:remaining});
    if(parts.length<=1)return;
    const frag=document.createDocumentFragment();
    parts.forEach(p=>{
      if(p.type==='text'){ frag.appendChild(document.createTextNode(p.v)); }
      else{
        const span=document.createElement('span');
        span.className='material-symbols-rounded';
        span.textContent=p.v;
        span.style.color=(p.v==='circle')?'inherit':'';
        frag.appendChild(span);
      }
    });
    textNode.parentNode.replaceChild(frag,textNode);
  });
}
let iconRAF=null;
const iconObserver=new MutationObserver(()=>{
  if(iconRAF)cancelAnimationFrame(iconRAF);
  iconRAF=requestAnimationFrame(applyIconSystem);
});
setTimeout(()=>{
  const root=document.getElementById('root');
  if(root){
    iconObserver.observe(root,{childList:true,subtree:true,characterData:true});
    applyIconSystem();
  }
},50);

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(ErrorBoundary,null,React.createElement(App,null))
);
</script>
<script>
// Nettoyage : désinstalle tout Service Worker installé par une version
// précédente (source du blocage sur l'ancien contenu en cache). L'app
// fonctionne pleinement sans lui — le stockage hors-ligne passe par
// IndexedDB, indépendant du Service Worker.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(r){ r.unregister(); });
  }).catch(function(){});
}
</script>
